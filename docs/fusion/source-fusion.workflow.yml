name: source-fusion

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check (no install, no workspaces)
        run: npm run check

      - name: Verify imported trees and receipts
        run: npm run fusion:verify

      - name: Authority boundary static check
        run: npm run authority

      - name: Fusion tool tests
        run: npm run test:fusion

      - name: M0 tool tests
        run: npm run test:m0

      - name: Orchestrator tests against known-failure allowlist
        timeout-minutes: 6
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: node tools/fusion/cli.mjs test-gate --suite orchestrator

      - name: Control-plane tests against known-failure allowlist
        timeout-minutes: 8
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: node tools/fusion/cli.mjs test-gate --suite control-plane
