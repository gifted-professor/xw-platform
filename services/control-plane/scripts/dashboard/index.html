<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>小红书 · 4 台控制台</title>
<style>
  :root {
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --r-card: 16px;
    --r-pill: 999px;
    --r-control: 10px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", Consolas, monospace;
    /* system colors */
    --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --purple: #af52de; --teal:#30b0c7;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f2f7;
      --bg-elev: #ffffff;
      --surface: rgba(255,255,255,0.82);
      --surface-solid:#ffffff;
      --toolbar: rgba(247,247,250,0.72);
      --hair: rgba(60,60,67,0.18);
      --hair-soft: rgba(60,60,67,0.10);
      --label: #1c1c1e;
      --label-2: #3c3c43;
      --label-3: #8e8e93;
      --label-4: #aeaeb2;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 2px 6px rgba(0,0,0,0.06), 0 18px 40px rgba(0,0,0,0.10);
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-elev: #1c1c1e;
      --surface: rgba(28,28,30,0.72);
      --surface-solid:#1c1c1e;
      --toolbar: rgba(28,28,30,0.72);
      --hair: rgba(255,255,255,0.18);
      --hair-soft: rgba(255,255,255,0.10);
      --label: #ffffff;
      --label-2: #ebebf5;
      --label-3: #98989f;
      --label-4: #636366;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.5);
      --shadow-lg: 0 2px 8px rgba(0,0,0,0.5), 0 20px 48px rgba(0,0,0,0.6);
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --surface: var(--surface-solid); --toolbar: var(--surface-solid); }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--label);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---- translucent toolbar (material & depth) ---- */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--toolbar);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--hair-soft);
    padding: 10px 16px calc(10px + env(safe-area-inset-top)) 16px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .toolbar-row { display: flex; align-items: baseline; gap: 10px; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-optical-sizing: auto; }
  .subtitle { font-size: 13px; color: var(--label-3); letter-spacing: 0.02em; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(52,199,89,0.5); animation: pulse 2.4s var(--ease) infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,199,89,0.45)} 70%{box-shadow:0 0 0 8px rgba(52,199,89,0)} 100%{box-shadow:0 0 0 0 rgba(52,199,89,0)} }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  /* ---- pills / buttons ---- */
  .btn {
    appearance: none; border: 0; margin: 0;
    background: var(--surface-solid);
    color: var(--label);
    border: 0.5px solid var(--hair);
    padding: 7px 14px; border-radius: var(--r-pill);
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
    cursor: pointer; user-select: none;
    transition: transform 120ms var(--ease), background 160ms var(--ease), border-color 160ms var(--ease), opacity 160ms var(--ease);
  }
  .btn:active { transform: scale(0.96); background: var(--bg-elev); }
  .btn.primary { background: var(--blue); color: #fff; border-color: transparent; }
  .btn.primary:active { background: #0a84ff; }
  .btn.danger { background: var(--red); color: #fff; border-color: transparent; }
  .btn.danger:active { background: #ff453a; }
  .btn.warn { background: var(--orange); color: #fff; border-color: transparent; }
  .btn.warn:active { background: #ff9f0a; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* ---- grid of cards ---- */
  .grid {
    display: grid; gap: 14px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
    max-width: 1100px; margin: 0 auto;
  }
  .card {
    background: var(--surface);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    backdrop-filter: blur(12px) saturate(150%);
    border: 0.5px solid var(--hair-soft);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 240ms var(--ease), transform 240ms var(--ease);
  }

  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 0.5px solid var(--hair-soft);
  }
  .serial { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .port { font-family: var(--mono); font-size: 11px; color: var(--label-4); margin-left: 2px; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--label-3); }
  .sdot { width: 8px; height: 8px; border-radius: 50%; }
  .sdot.ok { background: var(--green); } .sdot.down { background: var(--label-4); }
  .status.down { color: var(--red); }

  .card-body { padding: 12px 16px; }

  /* running task block — a distinct material layer */
  .running {
    background: color-mix(in srgb, var(--purple) 10%, transparent);
    border: 0.5px solid color-mix(in srgb, var(--purple) 30%, transparent);
    border-radius: 12px; padding: 12px 14px; margin: -2px 0 12px;
  }
  .running-top { display: flex; align-items: baseline; gap: 8px; }
  .rname { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .rcap { font-size: 12px; color: var(--purple); font-weight: 600; background: color-mix(in srgb,var(--purple) 16%,transparent); padding: 2px 8px; border-radius: var(--r-pill); }
  .rphase { margin-left: auto; font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .rloop { font-size: 13px; color: var(--label-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--hair-soft); margin: 8px 0 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--purple); transform-origin: left; transition: width 320ms var(--ease); }
  .rstats { font-size: 13px; color: var(--label-3); font-variant-numeric: tabular-nums; display: flex; gap: 14px; }
  .rstats b { color: var(--label-2); font-weight: 600; }
  .rerr { font-size: 12px; color: var(--red); margin-top: 8px; word-break: break-word; }

  /* idle rows */
  .row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 14px; }
  .row + .row { border-top: 0.5px solid var(--hair-soft); }
  .k { color: var(--label-3); min-width: 48px; font-size: 13px; letter-spacing: 0.01em; }
  .v { color: var(--label); word-break: break-word; flex: 1; }
  .v.good { color: var(--green); } .v.warn { color: var(--orange); } .v.err { color: var(--red); }
  .v .muted { color: var(--label-3); font-size: 12px; }
  .v.mono { font-family: var(--mono); font-size: 12.5px; }

  /* controls grouped near what they affect */
  .controls {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px;
    padding: 12px 16px; align-items: center;
    border-top: 0.5px solid var(--hair-soft);
    background: color-mix(in srgb, var(--bg-elev) 35%, transparent);
  }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field label { font-size: 10.5px; color: var(--label-4); letter-spacing: 0.04em; text-transform: uppercase; }
  select, input {
    appearance: none; -webkit-appearance: none;
    background: var(--bg-elev); color: var(--label);
    border: 0.5px solid var(--hair); border-radius: var(--r-control);
    padding: 6px 8px; font: inherit; font-size: 14px; width: 100%;
    transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  select { padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--label-3) 50%), linear-gradient(135deg, var(--label-3) 50%, transparent 50%); background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .num { width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
  .ctl { display: contents; }
  .btns { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 2px; }
  .btns .btn { flex: 1; }

  footer { text-align: center; color: var(--label-4); font-size: 12px; padding: 8px 16px 28px; letter-spacing: 0.01em; }

  /* reduced motion: cross-fade, no scale/spring/pulse */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: opacity 160ms ease !important; animation: none !important; }
    .btn:active { transform: none; }
    .live .dot { animation: none; }
  }
  @media (prefers-contrast: more) {
    :root { --surface: var(--surface-solid); --hair-soft: var(--hair); }
    .card { border-color: var(--hair); }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-row">
    <span class="title">小红书 · 4 台</span>
    <span class="subtitle">实时控制台</span>
    <span class="live"><span class="dot"></span><span id="ts">--:--:--</span></span>
  </div>
  <div class="actions">
    <button class="btn primary" onclick="allStart('养号',2,1)">齐跑养号 · 2圈 cap1</button>
    <button class="btn primary" onclick="allStart('涨粉',2,1)">齐跑涨粉 · 2圈 cap1</button>
    <button class="btn warn" onclick="allHome()">4 台全回首页</button>
    <button class="btn danger" onclick="allStop()">4 台全停</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<footer>每 3 秒刷新 · 任务跑批期间该卡跳过 activity 探测以降 adb 抢占 · 停止用 SIGINT 优雅退出(当前圈跑完才退)</footer>

<script>
const DEVS = ["REPLACE_SERIAL_01","REPLACE_SERIAL_03","REPLACE_SERIAL_02","REPLACE_SERIAL_04"];
let tasks = [];
let state = {};

async function api(path, opts) {
  try { const r = await fetch(path, opts || {}); return await r.json(); }
  catch (e) { return { error: String(e) }; }
}
const f = (x, d="-") => (x == null || x === "") ? d : x;

function actCls(a) {
  if (!a) return "";
  if (/Alipay|Gphone/i.test(a)) return "err";      // 支付/支付容器=危险
  if (/xingin\.xhs/i.test(a)) return "good";        // 小红书首页=安全
  return "warn";                                      // 其他 app=留意
}
function imeCls(ime) { return ime && /sogou/i.test(ime) ? "good" : "err"; } // 非 SogouIME=残留桥接

function fmtAct(a){ return a ? a.replace(/^com\.xingin\.xhs\//,"") : "—"; }

function render() {
  const grid = document.getElementById("grid");
  const dm = {}; (state.devices||[]).forEach(d => dm[d.serial] = d);
  grid.innerHTML = DEVS.map(s => {
    const d = dm[s] || { serial:s, serve:"down", running:false };
    const serveOk = d.serve === "ok";
    let body;
    if (d.task) {
      const r = d.task;
      const pct = r.loops ? Math.min(100, (r.loop||0)/r.loops*100) : 0;
      body = `<div class="running">
        <div class="running-top">
          <span class="rname">${f(r.name)}</span>
          ${r.cap!=null?`<span class="rcap">cap ${r.cap}</span>`:""}
          <span class="rphase">${f(r.phase)}</span>
        </div>
        <div class="rloop">第 ${(r.loop||0)} 圈 / 共 ${f(r.loops,"∞")}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="rstats"><span><b>${f(r.ok,0)}</b> ok</span><span><b>${f(r.skip,0)}</b> skip</span><span><b>${f(r.comments,0)}</b> 评论</span></div>
        ${r.lastErr?`<div class="rerr">${r.lastErr}</div>`:""}
      </div>`;
    } else {
      const lt = d.lastTask;
      body = `
        <div class="row"><span class="k">前台</span><span class="v ${actCls(d.activity)} mono">${fmtAct(d.activity)}</span></div>
        <div class="row"><span class="k">输入法</span><span class="v ${imeCls(d.ime)} mono">${f(d.ime)}</span></div>
        ${lt?`<div class="row"><span class="k">末次</span><span class="v"><b>${f(lt.name)}</b> · ok ${f(lt.ok,0)} / skip ${f(lt.skip,0)} / 评 ${f(lt.comments,0)} <span class="muted">exit ${f(lt.exitCode,"-")}</span>${lt.lastErr?` · <span style="color:var(--red)">${lt.lastErr}</span>`:""}</span></div>`:""}
        ${d.metrics?`<div class="row"><span class="k">serve</span><span class="v mono"><span class="muted">dump</span> ${f(d.metrics.dumps,0)} <span class="muted">tap</span> ${f(d.metrics.taps,0)}${d.metrics.avgDumpMs?` <span class="muted">avg</span> ${Math.round(d.metrics.avgDumpMs)}ms`:""}</span></div>`:""}
        ${!d.metrics && !lt && !d.activity?`<div class="row"><span class="k">状态</span><span class="v muted">等待 serve…</span></div>`:""}`;
    }
    return `<article class="card">
      <div class="card-head">
        <span class="serial">${s}</span><span class="port">:${d.port||""}</span>
        <span class="status ${serveOk?"":"down"}"><span class="sdot ${serveOk?"ok":"down"}"></span>${serveOk?"在线":"离线"}</span>
      </div>
      <div class="card-body">${body}</div>
      <div class="controls">
        <div class="field">
          <label>任务</label>
          <select id="t-${s}">${tasks.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
        </div>
        <div class="field"><label>圈</label><input id="l-${s}" class="num" type="number" value="2" min="1" max="200" inputmode="numeric"></div>
        <div class="field"><label>cap</label><input id="c-${s}" class="num" type="number" value="1" min="0" max="20" inputmode="numeric"></div>
        <div class="field" style="justify-content:end"><label>&nbsp;</label><button class="btn warn" onclick="homeOne('${s}')" style="white-space:nowrap">回首页</button></div>
        <div class="btns">
          <button class="btn primary" onclick="startOne('${s}')">启动</button>
          <button class="btn danger" onclick="stopOne('${s}')">停止</button>
        </div>
      </div>
    </article>`;
  }).join("");
  document.getElementById("ts").textContent = new Date().toLocaleTimeString("zh-CN",{hour12:false});
}

async function poll() { state = await api("/status"); render(); }
async function loadTasks() {
  const t = await api("/tasks");
  tasks = t.tasks || [];
  if (!tasks.length) tasks = ["养号","涨粉","自主","互动","纯刷"];
  render();
}
function jbody(o){ return {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}; }
function startOne(s){
  const task=document.getElementById("t-"+s).value, loops=document.getElementById("l-"+s).value, cap=document.getElementById("c-"+s).value;
  api("/task", jbody({serial:s,action:"start",task,loops,cap})).then(poll);
}
function stopOne(s){ api("/task", jbody({serial:s,action:"stop"})).then(()=>setTimeout(poll,300)); }
function homeOne(s){ api("/home", jbody({serial:s})).then(poll); }
function allStart(task,loops,cap){ DEVS.forEach(s=>api("/task", jbody({serial:s,action:"start",task,loops,cap}))); setTimeout(poll,500); }
function allStop(){ DEVS.forEach(stopOne); }
function allHome(){ DEVS.forEach(homeOne); }

loadTasks(); poll(); setInterval(poll, 3000);
</script>
</body>
</html>
